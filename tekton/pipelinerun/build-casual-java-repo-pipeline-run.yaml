apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: build-casual-java-repo-pipeline-run-
spec:
  workspaces:
    - name: pipeline-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  params:
    - name: image-registry
      value: 192.168.50.178:5000
    - name: repository-casual-java-integration-test
      value:
        revision: "feature/mathias"
    - name: repository-casual-java
      value:
        revision: "fix/service-call-event-marshalling-with-optional-values"
        build: "true"
    - name: repository-casual-caller
      value:
        revision: "dev"
        build: "false"
    - name: repository-casual-java-test-apps
      value:
        revision: "dev"
        build: "true"
    - name: casual-java-image
      value:
        name: "casual-java"
        version: "3.4.3"
  pipelineRef:
    name: build-casual-java-repo-pipeline
