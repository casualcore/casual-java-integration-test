apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: build-casual-java-repo-pipeline-run-
spec:
  serviceAccountName: tekton-pipeline-test
  workspaces:
    - name: pipeline-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  params:
    - name: image-registry
      value: 192.168.68.130:5000
    - name: repository-casual-java-integration-test
      value:
        revision: "feature/tekton-build"
    - name: repository-casual-java
      value:
        revision: "dev"
    - name: repository-casual-java-test-apps
      value:
        revision: "feature/2.0/simple-fielded-test"
    - name: casual-java-image
      value:
        name: "casual-java"
        version: "3.3.8"
  pipelineRef:
    name: build-casual-java-repo-pipeline