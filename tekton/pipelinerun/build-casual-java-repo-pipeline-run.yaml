apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: build-casual-java-repo-pipeline-run-
spec:
  workspaces:
    - name: pipeline-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - name: pipeline-build-cache
      persistentVolumeClaim:
        claimName: build-cache-pvc
  params:
    - name: image-registry
      value: 192.168.1.93:32000
    - name: repository-casual-java-integration-test
      value:
        revision: "feature/casual-java-versions-matrix"
    - name: repository-casual-java
      value:
        revision: "3.7.4"
        build: "false"
    - name: repository-casual-caller
      value:
        revision: "3.4.4"
        build: "false"
    - name: repository-casual-java-test-apps
      value:
        revision: "dev"
        build: "true"
    - name: casual-java-image
      value:
        name: "casual-java"
        version: "3.7.4-SNAPSHOT"
  pipelineRef:
    name: build-casual-java-repo-pipeline
