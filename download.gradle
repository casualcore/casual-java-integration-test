apply plugin: "java-library"

sourceSets {
    downloadCasualJava
    downloadCasualCaller
}
def casualJavaVersion = System.getenv("CASUAL_JAVA_VERSION") ?: "3.3.9"
def casualCallerVersion = System.getenv("CASUAL_CALLER_VERSION") ?: "3.2.22"

dependencies {
    downloadCasualJavaRuntimeOnly "se.laz.casual:casual-api:${casualJavaVersion}"
    downloadCasualJavaRuntimeOnly "se.laz.casual:casual-inbound-handler-api:${casualJavaVersion}"
    downloadCasualJavaRuntimeOnly "se.laz.casual:casual-service-discovery-extension:${casualJavaVersion}"
    downloadCasualJavaRuntimeOnly "se.laz.casual:casual-event-api:${casualJavaVersion}"
    downloadCasualJavaRuntimeOnly "se.laz.casual:casual-jca-app:${casualJavaVersion}"
    downloadCasualJavaRuntimeOnly "se.laz.casual:casual-inbound-startup-trigger-app:${casualJavaVersion}"

    downloadCasualCallerRuntimeOnly "se.laz.casual:casual-caller-app:${casualCallerVersion}"
}

task downloadCasualJava( type: Copy)
{
    from sourceSets.downloadCasualJava.runtimeClasspath
    into 'runtime/'
}

task downloadCasualCaller( type: Copy)
{
    from sourceSets.downloadCasualCaller.runtimeClasspath
    into 'runtime/'
}